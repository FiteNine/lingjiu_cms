<!-- 分页条包装：分页主体在 LIST / HOME / DETAIL（列表分页）上都存在，page.totalPages 为假时不渲染页码。
     注意：include 的字面量参数只能被 param 字段引用读出，无法插进 pagelist 的参数里，
     因此 items / listsize 只能写死在这里；需要第二种组合时直接写在模板里（见 book_detail.html）。 -->
{cms:if field='page.totalPages'}
<nav class="pager" aria-label="分页导航">
  <p class="pager__info">第 [field:page.pageNo/] / [field:page.totalPages/] 页 · 共 [field:page.totalCount/] 条</p>
  <div class="pager__list">
  {cms:pagelist listsize='5' items='first,prev,pageno,current,next,last'}
    <a class="pager__link [field:class/]" href="[field:url/]" rel="[field:rel/]">[field:label/]</a>
  {/cms:pagelist}
  </div>
</nav>
{cms:else/}
<nav class="pager pager--empty" aria-label="分页导航">
  <p class="pager__info">本页共 [field:page.totalCount/] 条内容</p>
</nav>
{/cms:if}
